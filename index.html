<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student grade calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2>student grade calculator</h2>
        <div class="flex-box">
            <div class="card">
                <div class="input">
                    <input type="number" id="phy" placeholder="physics">
                    <input type="number" id="chem" placeholder="chemistry">
                    <input type="number" id="bio" placeholder="biology">
                    <input type="number" id="math" placeholder="mathametics">
                    <button onclick="cal()">calculator marks</button>
                    <p id="demo"></p>
                    <p id="demo1"></p>
                    <p id="demo2"></p>

                </div>

            </div>


        </div>


    </div>
</body>
<script src="script.js"></script>

</html>
